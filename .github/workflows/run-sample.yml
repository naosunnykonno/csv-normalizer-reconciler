name: Run sample

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the normalizer and reconciler on the sample data
        run: python normalize_csv.py
      - name: Upload the generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: sample-output
          path: output/
